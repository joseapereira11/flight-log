name: Track aircraft

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check aircraft
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase --quiet && git push --quiet
          fi
